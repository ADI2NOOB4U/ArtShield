version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artshield-postgres
    environment:
      POSTGRES_DB: artshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - artshield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artshield"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: artshield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - artshield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: redis-server --appendonly yes
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  artshield-network:
    driver: bridge